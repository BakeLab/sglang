name: PR Test Extra (AMD)
# Gitea-only extra CI; BB matches exact hardware labels and available capacity.

on:
  push:
    branches: ["**"]
    paths:
      - "python/**"
      - "rust/**"
      - "proto/**"
      - "test/**"
      - "scripts/ci/**"
      - ".github/workflows/_pr-test-*.yml"
      - ".github/actions/**"
      - ".gitea/workflows/**"
      - "docker/rocm.Dockerfile"
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "proto/**"
      - "test/**"
      - "scripts/ci/**"
      - ".github/workflows/_pr-test-*.yml"
      - ".github/actions/**"
      - ".gitea/workflows/**"
      - "docker/rocm.Dockerfile"
  workflow_dispatch:
    inputs:
      runner_arch:
        description: 'AMD runner pool to dispatch GPU jobs to'
        required: false
        type: choice
        default: mi300
        options:
          - mi300
          - mi325
      rocm_version:
        description: 'ROCm container variant (ROCm 10 by default)'
        required: false
        type: choice
        default: rocm10
        options:
          - rocm10
          - rocm724
          - rocm720
      aiter_ref:
        description: 'Override AITER commit (optional, leave empty to use Dockerfile default)'
        required: false
        type: string
        default: ''
      amd_ci_image:
        description: 'Override AMD CI Docker image (optional, e.g. rocm/sgl-dev:tag)'
        required: false
        type: string
        default: ''
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      runner_arch:
        description: 'AMD runner pool to dispatch GPU jobs to'
        required: false
        type: string
        default: mi300
      rocm_version:
        description: 'ROCm container variant (ROCm 10 by default)'
        required: false
        type: string
        default: rocm10
      aiter_ref:
        description: 'Override AITER commit (optional, leave empty to use Dockerfile default)'
        required: false
        type: string
        default: ''
      amd_ci_image:
        description: 'Override AMD CI Docker image (optional, e.g. rocm/sgl-dev:tag)'
        required: false
        type: string
        default: ''
      continue_on_error:
        description: 'Continue on error (do not fail the workflow on test failures)'
        required: false
        type: boolean
        default: false

env:
  AITER_COMMIT_OVERRIDE: ${{ inputs.aiter_ref }}
  AMD_CI_IMAGE: ${{ inputs.amd_ci_image }}
  DOCKERHUB_AMD_USERNAME: ${{ secrets.DOCKERHUB_AMD_USERNAME }}
  DOCKERHUB_AMD_TOKEN: ${{ secrets.DOCKERHUB_AMD_TOKEN }}

concurrency:
  # Schedule/dispatch runs key on run_id plus ROCm version so the three
  # scheduled reusable-workflow matrix calls cannot replace each other's
  # pending runs. PR runs still share a per-branch group so pushes cancel stale
  # runs. In a reusable workflow github.event_name is the originating event.
  group: pr-test-amd-extra-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('full-{0}-{1}', github.run_id, inputs.rocm_version || 'rocm10') || github.head_ref || github.ref_name || inputs.ref || 'default' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          token: ''
          base: trim
          ref: ${{ inputs.ref || github.sha }}
          filters: |
            runtime:
              - 'python/**'
              - 'test/**'
              - 'scripts/ci/**'
              - '.github/actions/**'
              - 'docker/rocm.Dockerfile'
              - '.gitea/workflows/pr-test-amd-extra.yml'

  # =============================================== extra-a (1-gpu-small) ===============================================
  # ~1.5h of tests in total; four shards keep each well under the step timeout.
  extra-a-test-1-gpu-small-amd:
    needs: check-changes
    if: needs.check-changes.outputs.runtime == 'true' || github.event_name == 'workflow_dispatch'
    name: ${{ format('extra-a-test-1-gpu-small-amd ({0}, linux-{1}-1gpu-sglang, {2})', inputs.rocm_version || 'rocm10', inputs.runner_arch || 'mi300', matrix.part) }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    runs-on: ${{ format('linux-{0}-1gpu-sglang', inputs.runner_arch || 'mi300') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        # `inputs` is empty on pull_request events, so fall back explicitly to
        # the ROCm 10 PR default. Reusable callers can request another variant.
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 75
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w "/sglang-checkout/test" python3 run_suite.py --hw amd --suite extra-a-test-1-gpu-small-amd --auto-partition-id ${{ matrix.part }} --auto-partition-size 4 --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== extra-a (1-gpu-large) ===============================================
  # Single-GPU lora / spec / quant / perf model e2e tests. Runs on the same
  # 1-gpu pool as small (AMD GPUs carry enough VRAM that "large" here is a
  # CUDA memory-tier label, not a separate AMD runner pool). ~50 min in total.
  extra-a-test-1-gpu-large-amd:
    needs: check-changes
    if: needs.check-changes.outputs.runtime == 'true' || github.event_name == 'workflow_dispatch'
    name: ${{ format('extra-a-test-1-gpu-large-amd ({0}, linux-{1}-1gpu-sglang, {2})', inputs.rocm_version || 'rocm10', inputs.runner_arch || 'mi300', matrix.part) }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    runs-on: ${{ format('linux-{0}-1gpu-sglang', inputs.runner_arch || 'mi300') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 60
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w "/sglang-checkout/test" python3 run_suite.py --hw amd --suite extra-a-test-1-gpu-large-amd --auto-partition-id ${{ matrix.part }} --auto-partition-size 2 --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== extra-a (2-gpu-large) ===============================================
  # Multi-GPU TP / PP / PD mock-model + kv_canary e2e tests and PP/MoE
  # throughput. Mirrors CUDA's extra-a 2-gpu-large stage; runs on the 2-GPU
  # AMD pool.
  extra-a-test-2-gpu-large-amd:
    needs: check-changes
    if: needs.check-changes.outputs.runtime == 'true' || github.event_name == 'workflow_dispatch'
    name: ${{ format('extra-a-test-2-gpu-large-amd ({0}, linux-{1}-2gpu-sglang, {2})', inputs.rocm_version || 'rocm10', inputs.runner_arch || 'mi300', matrix.part) }}
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    runs-on: ${{ format('linux-{0}-2gpu-sglang', inputs.runner_arch || 'mi300') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 60
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh -w "/sglang-checkout/test" python3 run_suite.py --hw amd --suite extra-a-test-2-gpu-large-amd --auto-partition-id ${{ matrix.part }} --auto-partition-size 2 --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== extra-b (4-gpu) ===============================================
  # 4-GPU tests that CUDA runs in extra-b. Same container env as the
  # stage-c-test-4-gpu-amd job in pr-test-amd.yml.
  extra-b-test-4-gpu-amd:
    needs: check-changes
    if: needs.check-changes.outputs.runtime == 'true' || github.event_name == 'workflow_dispatch'
    name: ${{ format('extra-b-test-4-gpu-amd ({0}, linux-{1}-4gpu-sglang)', inputs.rocm_version || 'rocm10', inputs.runner_arch || 'mi300') }}
    runs-on: ${{ format('linux-{0}-4gpu-sglang', inputs.runner_arch || 'mi300') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure VRAM is clear
        run: bash scripts/ci/amd/ensure_vram_clear.sh rocm

      - name: Start CI container
        run: bash scripts/ci/amd/amd_ci_start_container.sh --rocm-version ${{ inputs.rocm_version || 'rocm10' }}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Install dependencies
        run: bash scripts/ci/amd/amd_ci_install_dependency.sh

      - name: Run test
        timeout-minutes: 60
        run: |
          bash scripts/ci/amd/amd_ci_exec.sh \
            -e NCCL_CUMEM_ENABLE=0 \
            -e NCCL_NVLS_ENABLE=0 \
            -e RCCL_MSCCL_ENABLE=0 \
            -e SGLANG_USE_ROCM700A=1 \
            -w "/sglang-checkout/test" \
            python3 run_suite.py --hw amd --suite extra-b-test-4-gpu-amd --timeout-per-file 1800 ${{ inputs.continue_on_error == true && '--continue-on-error' || '' }}

  # =============================================== aggregator ====================================================
  # Single fan-in job so branch protection / notifications depend on one job
  # rather than every matrix leg. Fails if any dependent failed or was
  # cancelled; `skipped` (e.g. unrelated changes) is not a failure.
  pr-test-amd-extra-finish:
    needs:
      [
        check-changes,
        extra-a-test-1-gpu-small-amd,
        extra-a-test-1-gpu-large-amd,
        extra-a-test-2-gpu-large-amd,
        extra-b-test-4-gpu-amd,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')
          for job in $job_names; do
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          echo "All jobs completed successfully"
          exit 0
