name: PR Test Extra
# Gitea-only extra CI; BB matches exact hardware labels and available capacity.

on:
  push:
    branches: ["**"]
    paths:
      - "python/**"
      - "rust/**"
      - "proto/**"
      - "benchmark/simulator/**"
      - "tools/sglang-simulator/**"
      - "test/**"
      - "scripts/ci/**"
      - ".github/workflows/_pr-test-*.yml"
      - ".github/actions/**"
      - ".gitea/workflows/**"
  pull_request:
    paths:
      - "python/**"
      - "rust/**"
      - "proto/**"
      - "benchmark/simulator/**"
      - "tools/sglang-simulator/**"
      - "test/**"
      - "scripts/ci/**"
      - ".github/workflows/_pr-test-*.yml"
      - ".github/actions/**"
      - ".gitea/workflows/**"
  workflow_dispatch:
    inputs:
      force_continue_on_error:
        description: "Force continue-on-error (test scheduled CI behavior)"
        required: false
        type: boolean
        default: false
      test_parallel_dispatch:
        description: "Test parallel dispatch behavior (simulates scheduled run)"
        required: false
        type: boolean
        default: false
      run_all_tests:
        description: "Run all tests — bypasses paths-filter (needed when dispatching against long-lived branches whose diff against main can't resolve a merge-base in a shallow clone)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      git_ref:
        description: 'Git ref (branch, tag, or SHA) to test. If not provided, uses the default branch.'
        required: false
        type: string
        default: ''
      run_all_tests:
        description: "Run all tests (for releasing or testing purpose)"
        required: false
        type: boolean
        default: false
      skip_pr_test_health_check:
        description: "Skip PR test health check fail-fast (e.g. for release branch cuts)"
        required: false
        type: boolean
        default: false

concurrency:
  # Keys on the PR number: two forks can share a head_ref and would cancel each other.
  group: pr-test-extra-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || 'default' }}-${{ inputs.git_ref || 'all' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  SGLANG_IS_IN_CI: true
  SGLANG_CUDA_COREDUMP: "1"
  SGLANG_JIT_DEEPGEMM_FAST_WARMUP: true
  SKIP_PR_TEST_HEALTH_CHECK: ${{ (inputs.skip_pr_test_health_check == true || inputs.run_all_tests == true) && 'true' || 'false' }}
  PR_TEST_BYPASS_MAINTENANCE_ON_MAIN: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
  USE_VENV: false

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  # =============================================== check changes ====================================================
  check-changes:
    uses: ./.github/workflows/_pr-test-check-changes.yml
    with:
      git_ref: ${{ inputs.git_ref || '' }}
      run_all_tests: ${{ inputs.run_all_tests == true }}
      force_continue_on_error: ${{ inputs.force_continue_on_error == true }}
      pr_test_yml: '.gitea/workflows/pr-test-extra.yml'
    secrets: inherit

  # =============================================== sgl-kernel ====================================================
  sgl-kernel-build-wheels:
    needs: [check-changes]
    if: |
      needs.check-changes.result == 'success' &&
      needs.check-changes.outputs.sgl_kernel == 'true'
    uses: ./.github/workflows/_pr-test-sgl-kernel-build.yml
    with:
      runs_on: x64-kernel-build-node
      job_display_name: Build Wheel
      git_ref: ${{ inputs.git_ref || '' }}
      skip_pr_test_health_check: ${{ inputs.skip_pr_test_health_check == true }}
    secrets: inherit

  # =============================================== Rust extensions ====================================================

  # Extra builds its own artifacts because they are scoped to each run. Only artifact_name is suffixed; the cache prefix
  # stays at the default so the two workflows share one cache entry.
  rust-ext-build:
    needs: [check-changes]
    if: |
      !cancelled() &&
      needs.check-changes.result == 'success'
    uses: ./.github/workflows/_pr-test-rust-ext-build.yml
    with:
      runs_on: ubuntu-latest
      artifact_name: rust-ext-x86_64-extra
      git_ref: ${{ inputs.git_ref || '' }}
      skip_pr_test_health_check: ${{ inputs.skip_pr_test_health_check == true }}
    secrets: inherit

  simulator-test-cpu:
    needs: [check-changes, rust-ext-build]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' }}
    uses: ./.github/workflows/_pr-test-simulator-cpu.yml
    with:
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}
    # No `secrets: inherit`: this hosted CPU job has no secret consumer.

  simulator-test-gpu:
    needs: [check-changes, sgl-kernel-build-wheels, rust-ext-build]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' }}
    uses: ./.github/workflows/_pr-test-simulator-gpu.yml
    with:
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      rust_ext_artifact: ${{ needs.rust-ext-build.outputs.artifact_name }}

  # =============================================== extra-a / extra-b ===============================================
  # `name:` keeps the job names wait-for-jobs and check-pr-test-health match on.
  extra-test:
    name: ${{ matrix.stage }}-test-${{ matrix.runner_config }}
    needs: [check-changes, sgl-kernel-build-wheels, rust-ext-build]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { stage: extra-a, runner_config: 1-gpu-small, timeout_per_file: '' }
          - { stage: extra-a, runner_config: 1-gpu-large, timeout_per_file: '1800' }
          - { stage: extra-a, runner_config: 2-gpu-large, timeout_per_file: '' }
          - {
              stage: extra-b,
              runner_config: 4-gpu-h100,
              timeout_per_file: '3600',
              warmup_deep_gemm_models: 'lmsys/sglang-ci-dsv3-test:4',
              warmup_server_models: 'lmsys/sglang-ci-dsv3-test:4',
            }
          - { stage: extra-b, runner_config: 4-gpu-b200, timeout_per_file: '1800' }
          - {
              stage: extra-b,
              runner_config: 8-gpu-h200,
              timeout_per_file: '1800',
              warmup_deep_gemm_models: 'deepseek-ai/DeepSeek-V3-0324:8 deepseek-ai/DeepSeek-V3.2:8 XiaomiMiMo/MiMo-V2-Flash:4 XiaomiMiMo/MiMo-V2.5:8',
              warmup_timeout: '60',
            }
          - { stage: extra-b, runner_config: 8-gpu-h20, timeout_per_file: '3600' }
          - { stage: extra-b, runner_config: 8-gpu-b300, timeout_per_file: '3600' }
          - { stage: extra-b, runner_config: 2-gpu-gb300, timeout_per_file: '1800', arch: aarch64 }
          - { stage: extra-b, runner_config: 4-gpu-gb300, timeout_per_file: '1800', arch: aarch64 }
    uses: ./.github/workflows/_pr-test-stage.yml
    with:
      self_name: ${{ matrix.stage }}-test-${{ matrix.runner_config }}
      runner_config: ${{ matrix.runner_config }}
      check_changes: ${{ toJson(needs.check-changes.outputs) }}
      caller_inputs: ${{ toJson(inputs) }}
      partitions: ${{ needs.check-changes.outputs.partitions }}
      run_timeout_minutes: '60'
      timeout_per_file: ${{ matrix.timeout_per_file }}
      warmup_deep_gemm_models: ${{ matrix.warmup_deep_gemm_models || '' }}
      warmup_server_models: ${{ matrix.warmup_server_models || '' }}
      warmup_timeout_minutes: ${{ matrix.warmup_timeout || '25' }}
      # The artifact is built for x86_64. An aarch64 row passes none, so it
      # restores the aarch64 cache that pr-test.yml's aarch64 build seeds.
      rust_ext_artifact: ${{ matrix.arch != 'aarch64' && needs.rust-ext-build.outputs.artifact_name || '' }}
    secrets: inherit

  xeon-extra:
    needs: [check-changes]
    if: ${{ !failure() && !cancelled() && needs.check-changes.result == 'success' }}
    uses: ./.github/workflows/pr-test-xeon.yml
    with:
      ref: ${{ inputs.git_ref || github.ref }}
      run_all_tests: ${{ inputs.run_all_tests == true }}
      extra_only: true
    secrets: inherit

  # =============================================== aggregator ====================================================
  # Fail if any prerequisite or test failed or was cancelled.
  pr-test-extra-finish:
    needs:
      [
        check-changes,
        sgl-kernel-build-wheels,
        rust-ext-build,
        simulator-test-cpu,
        simulator-test-gpu,
        extra-test,
        xeon-extra,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')
          for job in $job_names; do
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          echo "All jobs completed successfully"
          exit 0
